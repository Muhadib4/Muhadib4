name: Generate arcade contribution graphs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/arcade.yml'

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Pac-Man and Galaga contribution graphs
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa # v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,galaga'
          hide_month_labels: 'false'

      - name: Publish arcade SVGs
        uses: crazy-max/ghaction-github-pages@1ebdede6822df72b485a37eecfadbea9a70a3e7d
        with:
          target_branch: arcade-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
